[workspace]
resolver = "2"

members = [
    "crates/mixteco-core",
    "crates/mixteco-orthography",
    "crates/mixteco-phonology",
    "crates/mixteco-corpus",
    "crates/mixteco-dictionary",
    "crates/mixteco-search",
    "crates/mixteco-xtn",
    "crates/mixteco-cli",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
authors = ["Giorgio"]

[workspace.dependencies]
unicode-normalization = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rayon = "1"
anyhow = "1"
ahash = "0.8"